# Local Postgres for development: `docker compose up -d`
# Host port 5433 so it never clashes with a Postgres installed on the machine (5432).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qura
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qura"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
